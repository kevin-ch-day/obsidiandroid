profile_id: research_all_malicious
description: Exploratory all-malicious cohort with relaxed integrity gates for discovery workflows.
evidence_mode: false
allow_vendor_fallback_for_width: true
allow_adaptive_top_k: true
top_k_requested: 8
exclude_unknown_from_main_results: false
type_slug_filter: null
cohort_gates:
  min_samples_per_family: 20
  require_mapped_family: true
  require_sha256: true
  allow_missing_package_name: true
  max_missing_package_pct: 5.0
  exclude_unknown_type_slug: true
  exclude_families:
    - Devixor
    - Gigabud
model_list:
  - random_forest
  - xgboost
  - logistic_regression
parser_overrides: {}
feature_flags:
  enable_sample_metadata_features: true
  enable_dynamic_generic_vendor_parsers: false
threshold_overrides: {}
dataset_filters:
  mode: malicious_only
