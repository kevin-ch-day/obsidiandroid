profile_id: dev_fast
description: "Fast local iteration profile (single model, reduced runtime features)."
profile_status:
  lifecycle: dev_only
  operator_surface: supported_dev
  support_tier: development
  status_label: Dev-only supported
  canonical_profile_id: dev_fast
evidence_mode: false
allow_vendor_fallback_for_width: true
allow_adaptive_top_k: true
top_k_requested: 8
exclude_unknown_from_main_results: false
type_slug_filter: null
cohort_gates:
  min_samples_per_family: 3
  require_mapped_family: true
  require_sha256: true
  allow_missing_package_name: true
  max_missing_package_pct: 10.0
  exclude_unknown_type_slug: false
  min_malicious_detections: 1
  family_cap: null
  family_cap_seed: null
model_list:
  - logistic_regression
parser_overrides: {}
feature_flags:
  enable_sample_metadata_features: true
  enable_dynamic_generic_vendor_parsers: false
runtime_overrides:
  ENABLE_CROSS_VALIDATION: false
  ENABLE_CV_REBALANCING: false
  ENABLE_SMOTE_OVERSAMPLING: false
  ENABLE_ABLATION_EXPERIMENTS: false
  ENABLE_PERMISSION_TRENDS_REPORT: false
  ENABLE_LABEL_RESOLUTION_STAGE: false
  ENABLE_ENGINE_WEIGHT_DB_SUMMARY: false
  ENABLE_FAMILY_DISTRIBUTION_REPORT: false
  ENABLE_AV_PIPELINE_EXCEL_EXPORT: false
  ENABLE_MODEL_COMPARISON_CSV_EXPORT: true
  ENABLE_MODEL_COMPARISON_EXCEL_EXPORT: false
threshold_overrides: {}
dataset_filters:
  mode: malicious_only
