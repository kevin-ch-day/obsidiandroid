profile_id: android_catalog_all_exploratory
description: "Exploratory current-catalog census of every dated Android APK, including benign and unresolved rows; family modeling remains label-gated."
cohort_readiness_bucket: android_platform
profile_status:
  lifecycle: exploratory
  operator_surface: supported
  support_tier: diagnostic
  status_label: Exploratory, not publication-locked
  canonical_profile_id: android_catalog_all_exploratory
evidence_mode: false
allow_vendor_fallback_for_width: true
allow_adaptive_top_k: true
top_k_requested: 8
exclude_unknown_from_main_results: false
type_slug_filter: null
cohort_gates:
  support_floor_mode: diagnostic_only
  min_samples_per_family: null
  require_mapped_family: false
  require_sha256: true
  allow_missing_package_name: true
  max_missing_package_pct: 100.0
  exclude_unknown_type_slug: false
  min_malicious_detections: 0
  time_window_start_utc: "1900-01-01T00:00:00Z"
model_list:
  - random_forest
  - xgboost
  - logistic_regression
parser_overrides: {}
feature_flags:
  enable_sample_metadata_features: true
  enable_dynamic_generic_vendor_parsers: false
runtime_overrides:
  ENABLE_CROSS_VALIDATION: false
  ENABLE_CV_REBALANCING: false
  ENABLE_ABLATION_EXPERIMENTS: false
  ENABLE_DETAILED_PER_CLASS_REPORTS: false
  ENABLE_PERMISSION_TRENDS_REPORT: false
  ENABLE_RESEARCH_VALIDITY_BUNDLE: false
threshold_overrides: {}
dataset_filters:
  mode: none
