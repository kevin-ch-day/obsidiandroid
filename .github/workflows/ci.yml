# Fast import smoke + pytest + strict ML static scan (no database required).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-fast:
    name: fast (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Pip dependency graph check
        run: pip check

      - name: Doc hygiene (no phantom paths)
        run: make doc-check

      - name: make verify
        run: make verify

      - name: ML static scan (strict)
        run: make ml-scan-strict

      - name: Upload CI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-fast-diagnostics-python-${{ matrix.python-version }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .pytest_tmp/**
            logs/**
            output/**

  test-integration:
    name: integration (python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Integration pytest lane
        run: make verify-integration

      - name: Upload CI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-integration-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .pytest_tmp/**
            logs/**
            output/**

  verify-v3:
    name: v3 closure (python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: V3 closure contract tests
        run: make verify-v3
