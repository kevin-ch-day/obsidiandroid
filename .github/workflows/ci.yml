# Fast import smoke + pytest + strict ML static scan (no database required).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.paths.outputs.integration }}
      pipeline_heavy: ${{ steps.paths.outputs.pipeline_heavy }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect integration-relevant path changes
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
            echo "pipeline_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
            echo "pipeline_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "${BASE}...HEAD" > /tmp/changed.txt
          INTEGRATION_PAT='^(src/obsidiandroid/(pipeline/|main\.py|cli/)|tests/test_(main_runtime|pipeline_ablation|small_smoke|db_cohort|startup_menu)|scripts/dev/run_tests_|Makefile|pyproject\.toml)'
          HEAVY_PAT='^(src/obsidiandroid/(pipeline/|main\.py)|tests/test_(main_runtime|pipeline_ablation)|scripts/dev/run_tests_pipeline|Makefile|pyproject\.toml)'
          if grep -Eq "${INTEGRATION_PAT}" /tmp/changed.txt; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
          else
            echo "integration=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq "${HEAVY_PAT}" /tmp/changed.txt; then
            echo "pipeline_heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "pipeline_heavy=false" >> "$GITHUB_OUTPUT"
          fi

  test-fast:
    name: fast (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Pip dependency graph check
        run: pip check

      - name: Doc hygiene (no phantom paths)
        run: make doc-check

      - name: make verify
        run: make verify

      - name: ML static scan (strict)
        run: make ml-scan-strict

      - name: Upload CI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-fast-diagnostics-python-${{ matrix.python-version }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .pytest_tmp/**
            logs/**
            output/**

  test-integration:
    name: integration (python 3.12)
    needs: detect-changes
    if: needs.detect-changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Integration pytest lane
        run: make verify-integration

      - name: Upload CI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-integration-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .pytest_tmp/**
            logs/**
            output/**

  test-pipeline-integration:
    name: pipeline integration (python 3.12)
    needs: detect-changes
    if: needs.detect-changes.outputs.pipeline_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Pipeline-heavy pytest lane
        run: make verify-pipeline-integration

      - name: Upload CI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-pipeline-integration-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .pytest_tmp/**
            logs/**
            output/**

  verify-v3:
    name: v3 closure (python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: V3 closure contract tests
        run: make verify-v3
