feature_contracts:
  A: android_family_av_abc_a_v1
  B: android_family_av_abc_b_v1
  C: android_family_av_abc_c_v1
allowed_sdk_columns: [meta__target_min_version, meta__target_sdk_version]
prohibited_feature_prefixes: [meta__vt_, parsed_, threat_, malware_type_, family_, package_, av_consensus_, av_risk_]
