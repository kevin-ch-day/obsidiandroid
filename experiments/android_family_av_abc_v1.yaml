  logistic_regression: {C: 1.0, max_iter: 2000, class_weight: balanced, solver: lbfgs, random_state: 42, scaler: standard_with_mean_false}
  xgboost: {n_estimators: 180, max_depth: 6, learning_rate: 0.05, subsample: 0.85, colsample_bytree: 0.85, reg_lambda: 1.0, objective: multi:softprob, eval_metric: mlogloss, random_state: 42, n_jobs: 1, early_stopping: disabled, calibration: disabled}
resampling: prohibited
tuning: prohibited
holdout:
