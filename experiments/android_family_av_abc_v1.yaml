  paired_comparisons: [B-A, C-A, C-B]
  metrics: [macro_f1, accuracy, weighted_f1]
bootstrap: {method: paired_family_stratified_lineage_component_percentile_bootstrap, draws: 1000, confidence_level: 0.95, seed: 20260716, max_undefined_draws: 0}
