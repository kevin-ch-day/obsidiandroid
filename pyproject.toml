[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidiandroid"
version = "2.2.0"
description = "ObsidianDroid"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[project.scripts]
obsidiandroid = "obsidiandroid.cli.startup_menu:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
    "obsidiandroid*",
    "config*",
    "profiles*",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
profiles = ["*.yaml"]

[tool.pytest.ini_options]
# Default: fast PR / local loop. Full suite: `make test-full` or `./scripts/dev/run_tests_full.sh`.
addopts = ["--basetemp=.pytest_tmp", "-m", "not (slow or integration or heavy or contract or pipeline_heavy)"]
markers = [
    "slow: Heavy integration or slow-import modules (manifest, menus, permission trends, ML trainers). Not selected by default.",
    "contract: Broad deterministic report, manifest, or governance contract checks. Excluded from the default fast loop but expected in CI/full validation.",
    "integration: Stage/menu/report contracts with notable fixture or orchestration cost. Excluded from the default fast loop.",
    "heavy: Plotting/export or other especially expensive checks. Excluded from the default fast loop.",
    "pipeline_heavy: Full partial-run_pipeline integration tests (~50s each). Run via make verify-pipeline-integration.",
]
