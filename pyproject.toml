[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidiandroid"
version = "2.1.0"
description = "ObsidianDroid"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[project.scripts]
obsidiandroid = "obsidiandroid.cli.startup_menu:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
  "obsidiandroid*",
  "analysis*",
  "config*",
  "scripts*",
  "database*",
  "ml_classification*",
  "model*",
  "profiles*",
  "utils*",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
profiles = ["*.yaml"]

[tool.pytest.ini_options]
# Default: fast PR / local loop. Full suite: `make test-full` or `./scripts/dev/run_tests_full.sh`.
addopts = ["--basetemp=.pytest_tmp", "-m", "not slow"]
markers = [
    "slow: Heavy integration or slow-import modules (manifest, menus, permission trends, ML trainers). Not selected by default.",
]
